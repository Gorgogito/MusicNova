[workspace]
resolver = "2"
members = ["crates/mn-core", "crates/mn-engine", "crates/mn-fx", "crates/mn-plugin", "crates/mn-stretch", "crates/mn-testplugin", "app/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Jorge Luis Torres Agapito"]

[profile.dev.package."*"]
opt-level = 2

# El audio en tiempo real (DSP, motor, estirador) necesita optimización también
# en desarrollo: sin ella los efectos son decenas de veces más lentos.
[profile.dev.package.mn-fx]
opt-level = 3

[profile.dev.package.mn-engine]
opt-level = 3

[profile.dev.package.mn-core]
opt-level = 3

[profile.dev.package.mn-stretch]
opt-level = 3
