[package]
name = "mn-plugin"
description = "MusicNova: alojamiento de plugins de audio CLAP y VST3"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mn-fx = { path = "../mn-fx" }
clap-sys = "0.5"
vst3 = "0.3"
libloading = "0.8"
rtrb = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Kernel", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi"] }

[dev-dependencies]
mn-core = { path = "../mn-core" }
uuid = { version = "1", features = ["v4"] }
