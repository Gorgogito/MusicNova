[package]
name = "mn-engine"
description = "MusicNova: motor de audio en tiempo real (mezcla multipista y transporte)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mn-core = { path = "../mn-core" }
mn-stretch = { path = "../mn-stretch" }
mn-fx = { path = "../mn-fx" }
cpal = "0.16"
rtrb = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Performance"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
